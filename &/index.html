<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | العودة للقوة</title>
    <!-- ربط ملف الـ CSS -->
    <link rel="stylesheet" href="main.css">
    <!-- خط Google Fonts عصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="login-card">
        <div class="card-header">
            <h2>نورتي مكانك يافنانه😂❤️</h2>
            <p>اكتبي كلمة السر وخشي برجلك اليمين ويارب تعجبك 😂❤️</p>
        </div>

        <div class="input-group">
            <input type="password" id="myPassword" placeholder="تاريخ ميلادك يافنانه❤️" required>
        </div>

        <button id="loginBtn" class="btn-primary">دخول الأساطير 🚀</button>
        
        <p id="message" class="error-msg"></p>
    </div>

    <!-- ربط ملف الـ JavaScript -->
    <script src="main.js"></script>
</body>
</html>
